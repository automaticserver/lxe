run:
  timeout: 10m

linters-settings:
  wsl:
    allow-cuddle-declarations: true
    allow-cuddle-assignment-not-used-in-block: true
  revive:
    rules:
      # https://github.com/mgechev/revive/blob/master/RULES_DESCRIPTIONS.md#unused-parameter
      - name: unused-parameter
        disabled: true

linters:
  enable-all: true
  disable:
    - depguard
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - godot
    - godox
    - gofumpt
    - gomoddirectives
    - exhaustive
    - exhaustruct
    - interfacebloat
    - ireturn
    - lll
    - nonamedreturns
    - testpackage
    - tparallel
    - varnamelen
    # deprecated
    - tenv
    # TODO: fix and remove
    - perfsprint
    - predeclared
    - thelper
    - wrapcheck

issues:
  exclude-rules:
    # some linters in tests files
    - path: _test\.go
      linters:
        - dogsled
        - dupl
        - errcheck
        - forcetypeassert
        - gocyclo
        - goerr113
        - err113
    # file and dir permissions can be read by more or we would use umask
    - text: "permissions to be 0[0-9]{3} or less"
      linters:
        - gosec
    # magic number from persistent flags
    - source: "(pflags\\.|PersistentFlags\\(\\)\\.)"
      linters:
        - mnd
    # magic number from cobra args definition
    - source: "Args: +cobra\\."
      linters:
        - mnd
    # False positive: https://github.com/kunwardeep/paralleltest/issues/8
    - text: "does not use range value in test Run"
      linters:
        - paralleltest
    # Tests in cli cannot be run parallel as of now
    - path: cli
      linters:
        - paralleltest
    # Use a lot of base 10 conversions
    - text: "Magic number: 10"
      linters:
        - mnd
    # And 32/64 bit sizes
    - text: "Magic number: 32"
      linters:
        - mnd
    - text: "Magic number: 64"
      linters:
        - mnd
    - text: "should be written without leading space as `//nolint:"
      linters:
        - nolintlint
    # Exclude all linters in thirdparty packages
    - path: "thirdparty/*"
      text: " "
